<dialog id="dlgDocente">
  <form id="formEditarDocente">
    <h2>Editar docente</h2>
    <div class="campo"><label for="eDNombre">Nombre completo</label><input id="eDNombre" required></div>
    <div class="campo"><label for="eDUid">UID de la tarjeta</label><input id="eDUid" required></div>
    <div class="botones">
      <button class="btn" type="button" data-cerrar>Cancelar</button>
      <button class="btn primario" type="submit">Guardar cambios</button>
    </div>
  </form>
</dialog>

<dialog id="dlgAula">
  <form id="formEditarAula">
    <h2>Editar aula</h2>
    <div class="campo"><label for="eANombre">Nombre del aula</label><input id="eANombre" required></div>
    <div class="botones">
      <button class="btn" type="button" data-cerrar>Cancelar</button>
      <button class="btn primario" type="submit">Guardar cambios</button>
    </div>
  </form>
</dialog>
