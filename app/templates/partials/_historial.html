<section class="vista" id="vista-historial" hidden>
  <div class="caja">
    <h2>Personas en el aula</h2>
    <div class="barra">
      <div class="campo"><label for="gAula">Aula</label><select id="gAula"></select></div>
      <div class="campo">
        <label for="gHoras">Periodo</label>
        <select id="gHoras">
          <option value="3">Últimas 3 horas</option>
          <option value="12" selected>Últimas 12 horas</option>
          <option value="24">Últimas 24 horas</option>
          <option value="168">Últimos 7 días</option>
        </select>
      </div>
    </div>
    <div class="grafica"><canvas id="grafica"></canvas></div>
    <p class="lectura-grafica" id="lecturaGrafica"></p>
  </div>

  <div class="caja">
    <h2>Registro de docentes</h2>
    <div class="barra">
      <div class="campo"><label for="fAula">Aula</label><select id="fAula"></select></div>
      <div class="campo"><label for="fDocente">Docente</label><select id="fDocente"></select></div>
      <div class="campo"><label for="fDesde">Desde</label><input id="fDesde" type="date"></div>
      <div class="campo"><label for="fHasta">Hasta</label><input id="fHasta" type="date"></div>
      <button class="btn" id="limpiarFiltros" type="button">Quitar filtros</button>
      <button class="btn primario" id="exportar" type="button">Descargar CSV</button>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Docente</th><th>Aula</th><th>Entrada</th><th>Salida</th><th>Duración</th><th class="acciones"></th></tr></thead>
        <tbody id="tablaRegistros"></tbody>
      </table>
    </div>
  </div>
</section>
