<section class="vista" id="vista-resumen">
  <p class="lectura" id="lectura">Cargando aulas…</p>
  <div class="filtros">
    <div class="segmentos" role="group" aria-label="Filtrar aulas">
      <button data-filtro="todas" aria-pressed="true">Todas</button>
      <button data-filtro="con" aria-pressed="false">Con docente</button>
      <button data-filtro="sin" aria-pressed="false">Sin docente</button>
      <button data-filtro="off" aria-pressed="false">Sin conexión</button>
    </div>
    <input id="buscar" type="search" placeholder="Buscar aula o docente" aria-label="Buscar aula o docente">
  </div>
  <ul class="tablero" id="tablero"></ul>
</section>
